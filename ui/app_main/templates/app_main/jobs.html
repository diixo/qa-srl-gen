{% extends 'app_main/base.html' %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">MONITORING</p><h1>{{ title }}</h1></div><a class="btn btn-primary" href="{% url 'app_main:pipeline' %}">+ New job</a></div>
<form method="get" class="d-flex gap-2 mb-3"><select class="form-select w-auto" name="status" aria-label="Status"><option value="">All statuses</option>{% for value, label in statuses %}<option value="{{ value }}" {% if selected == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn btn-outline-secondary">Apply</button></form>
<section class="panel">{% include 'app_main/includes/jobs_table.html' %}</section><div class="pagination-row">{% if jobs.has_previous %}<a href="?status={{ selected }}&page={{ jobs.previous_page_number }}">← Previous</a>{% endif %}<span>{{ jobs.number }} / {{ jobs.paginator.num_pages }}</span>{% if jobs.has_next %}<a href="?status={{ selected }}&page={{ jobs.next_page_number }}">Next →</a>{% endif %}</div>{% endblock %}
